<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週薪計算器 / Weekly Pay Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* =====================
VARIABLES
===================== */
:root {
–bg:           #1e2130;
–surface:      #272b3d;
–surface2:     #303550;
–border:       #3e4560;
–text:         #dde2f0;
–muted:        #7880a8;
–positive:     #68c496;
–neutral:      #68aee0;
–warn:         #dea060;
–focus-pos:    rgba(104,196,150,0.16);
–focus-neu:    rgba(104,174,224,0.16);
–badge-pos-bg: rgba(104,196,150,0.12);
–badge-pos-bd: rgba(104,196,150,0.32);
–badge-neu-bg: rgba(104,174,224,0.12);
–badge-neu-bd: rgba(104,174,224,0.32);
–btn-text:     #0c2018;
–btn2-text:    #091828;
–shadow:       0 2px 10px rgba(0,0,0,0.3);
–radius:       12px;
}

/* =====================
RESET
===================== */
*, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}

/* =====================
BASE
===================== */
html {
background-color: #1e2130;
}

body {
background-color: #1e2130;
color: #dde2f0;
font-family: ‘Noto Sans TC’, sans-serif;
min-height: 100vh;
padding: 32px 16px 64px;
}

/* =====================
LAYOUT
===================== */
.wrap {
max-width: 740px;
margin: 0 auto;
}

/* =====================
HEADER
===================== */
.page-header {
display: flex;
align-items: flex-end;
justify-content: space-between;
gap: 16px;
flex-wrap: wrap;
margin-bottom: 36px;
}

.title-block h1 {
font-size: clamp(22px, 5vw, 32px);
font-weight: 700;
letter-spacing: -0.5px;
line-height: 1.1;
}

.title-highlight {
color: var(–positive);
}

.title-sub {
color: var(–muted);
font-size: 13px;
margin-top: 6px;
font-weight: 300;
}

/* =====================
HEADER CONTROLS
===================== */
.header-controls {
display: flex;
align-items: center;
gap: 10px;
flex-wrap: wrap;
}

.lang-toggle {
display: flex;
background-color: var(–surface);
border: 1px solid var(–border);
border-radius: 100px;
overflow: hidden;
}

.lang-btn {
background: transparent;
border: none;
color: var(–muted);
font-family: ‘DM Mono’, monospace;
font-size: 12px;
padding: 6px 14px;
cursor: pointer;
transition: background-color 0.2s, color 0.2s;
}

.lang-btn.is-active {
background-color: var(–positive);
color: var(–btn-text);
font-weight: 600;
}

.week-nav {
display: flex;
align-items: center;
gap: 8px;
}

.week-nav-btn {
background-color: var(–surface);
border: 1px solid var(–border);
color: var(–muted);
font-size: 16px;
padding: 6px 12px;
border-radius: 6px;
cursor: pointer;
font-family: ‘Noto Sans TC’, sans-serif;
transition: color 0.2s, border-color 0.2s;
}

.week-nav-btn:hover {
color: var(–text);
border-color: var(–text);
}

.week-label {
font-family: ‘DM Mono’, monospace;
font-size: 13px;
color: var(–muted);
min-width: 190px;
text-align: center;
}

/* =====================
SECTION DIVIDER
===================== */
.section-divider {
display: flex;
align-items: center;
gap: 10px;
font-size: 11px;
letter-spacing: 2px;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 12px;
}

.section-divider::after {
content: ‘’;
flex: 1;
height: 1px;
background-color: var(–border);
}

/* =====================
SETTINGS CARD
===================== */
.settings-card {
background-color: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 24px;
margin-bottom: 24px;
position: relative;
overflow: hidden;
box-shadow: var(–shadow);
}

.settings-card::before {
content: ‘SETTINGS’;
position: absolute;
top: 16px;
right: 16px;
font-family: ‘DM Mono’, monospace;
font-size: 10px;
color: var(–border);
letter-spacing: 2px;
}

.mode-switch-row {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 20px;
flex-wrap: wrap;
}

.mode-switch-label {
font-size: 11px;
color: var(–muted);
letter-spacing: 1px;
text-transform: uppercase;
font-weight: 500;
}

.mode-toggle {
display: flex;
background-color: var(–surface2);
border: 1px solid var(–border);
border-radius: 8px;
overflow: hidden;
}

.mode-btn {
background: transparent;
border: none;
color: var(–muted);
font-family: ‘Noto Sans TC’, sans-serif;
font-size: 13px;
padding: 8px 18px;
cursor: pointer;
white-space: nowrap;
transition: background-color 0.2s, color 0.2s;
}

.mode-btn.is-active {
background-color: var(–neutral);
color: var(–btn2-text);
font-weight: 600;
}

.settings-grid {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 16px;
}

/* =====================
FORM FIELDS
===================== */
.field label {
display: block;
font-size: 11px;
color: var(–muted);
letter-spacing: 1px;
text-transform: uppercase;
margin-bottom: 8px;
font-weight: 500;
}

.field input {
width: 100%;
background-color: var(–surface2);
border: 1px solid var(–border);
border-radius: 8px;
color: var(–text);
font-size: 15px;
font-family: ‘DM Mono’, monospace;
padding: 10px 12px;
outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
border-color: var(–positive);
box-shadow: 0 0 0 3px var(–focus-pos);
}

.field input::placeholder {
color: var(–muted);
opacity: 1;
}

input[type=“number”]::-webkit-inner-spin-button,
input[type=“number”]::-webkit-outer-spin-button {
-webkit-appearance: none;
}

input[type=“number”] {
-moz-appearance: textfield;
}

/* =====================
DAY ROWS
===================== */
.days-container {
display: flex;
flex-direction: column;
gap: 8px;
margin-bottom: 24px;
}

.day-row {
background-color: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 14px 20px;
display: grid;
grid-template-columns: 90px 1fr 120px 110px;
gap: 12px;
align-items: center;
box-shadow: var(–shadow);
transition: border-color 0.2s, transform 0.15s;
}

.day-row:hover {
border-color: var(–positive);
transform: translateX(2px);
}

.day-name {
font-weight: 500;
font-size: 14px;
display: flex;
flex-direction: column;
gap: 2px;
}

.day-date {
font-size: 11px;
color: var(–muted);
font-family: ‘DM Mono’, monospace;
}

.day-input {
background-color: var(–surface2);
border: 1px solid var(–border);
border-radius: 8px;
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 14px;
padding: 8px 12px;
outline: none;
width: 100%;
transition: border-color 0.2s, box-shadow 0.2s;
}

.day-input:focus {
border-color: var(–neutral);
box-shadow: 0 0 0 3px var(–focus-neu);
}

.day-mid {
font-family: ‘DM Mono’, monospace;
font-size: 13px;
color: var(–muted);
text-align: right;
transition: color 0.2s;
}

.day-mid.is-active {
color: var(–neutral);
}

.day-pay {
font-family: ‘DM Mono’, monospace;
font-size: 14px;
font-weight: 600;
text-align: right;
color: var(–muted);
}

.day-pay.is-commission { color: var(–positive); }
.day-pay.is-base       { color: var(–neutral); }

/* =====================
RESULT CARD
===================== */
.result-card {
background-color: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 28px 24px;
position: relative;
overflow: hidden;
box-shadow: var(–shadow);
}

.result-card::after {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 3px;
background: linear-gradient(90deg, var(–positive), var(–neutral));
}

.result-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
margin-bottom: 24px;
}

.stat {
display: flex;
flex-direction: column;
gap: 6px;
}

.stat-label {
font-size: 11px;
color: var(–muted);
letter-spacing: 1px;
text-transform: uppercase;
}

.stat-value {
font-family: ‘DM Mono’, monospace;
font-size: 20px;
font-weight: 500;
}

.stat.is-highlight {
grid-column: 1 / -1;
padding-top: 16px;
border-top: 1px solid var(–border);
}

.stat.is-highlight .stat-value {
color: var(–positive);
font-size: 32px;
}

.result-divider {
height: 1px;
background-color: var(–border);
margin: 20px 0;
}

/* =====================
WAGE MODE ROW
===================== */
.wage-mode-row {
display: flex;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 12px;
}

.wage-mode-left {
display: flex;
align-items: center;
gap: 10px;
}

.wage-mode-label {
font-size: 13px;
color: var(–muted);
}

.mode-badge {
display: inline-flex;
align-items: center;
gap: 6px;
padding: 5px 12px;
border-radius: 100px;
font-size: 12px;
font-weight: 500;
font-family: ‘DM Mono’, monospace;
}

.mode-badge::before {
content: ‘●’;
font-size: 8px;
}

.mode-badge.is-commission {
background-color: var(–badge-pos-bg);
color: var(–positive);
border: 1px solid var(–badge-pos-bd);
}

.mode-badge.is-base {
background-color: var(–badge-neu-bg);
color: var(–neutral);
border: 1px solid var(–badge-neu-bd);
}

.calc-hint {
font-size: 12px;
color: var(–muted);
font-family: ‘DM Mono’, monospace;
}

/* =====================
TIP BOX
===================== */
.tip-box {
display: none;
border-radius: 8px;
padding: 12px 16px;
font-size: 12px;
color: var(–warn);
background-color: rgba(222,160,96,0.08);
border: 1px solid rgba(222,160,96,0.25);
margin-top: 16px;
}

.tip-box.is-visible { display: block; }

/* =====================
ACTIONS
===================== */
.action-row {
display: flex;
gap: 10px;
margin-top: 24px;
flex-wrap: wrap;
}

.btn {
padding: 10px 20px;
border-radius: 8px;
font-size: 13px;
font-weight: 500;
cursor: pointer;
border: none;
font-family: ‘Noto Sans TC’, sans-serif;
letter-spacing: 0.3px;
transition: filter 0.15s, transform 0.15s;
}

.btn-primary {
background-color: var(–positive);
color: var(–btn-text);
}

.btn-primary:hover {
filter: brightness(1.1);
transform: translateY(-1px);
}

.btn-ghost {
background-color: transparent;
border: 1px solid var(–border);
color: var(–muted);
transition: border-color 0.2s, color 0.2s;
}

.btn-ghost:hover {
border-color: var(–text);
color: var(–text);
}

/* =====================
RESPONSIVE
===================== */
@media (max-width: 600px) {
.settings-grid { grid-template-columns: 1fr 1fr; }
.day-row       { grid-template-columns: 80px 1fr 90px; }
.day-pay       { display: none; }
}

@media (max-width: 400px) {
.settings-grid { grid-template-columns: 1fr; }
}

</style>
</head>

<script>

/* =====================
   STRINGS
   ===================== */
var STRINGS = {
  zh: {
    h1second:       '計算器',
    titleSub:       '業績抽成 · 澳幣 AUD · 每週記錄',
    lblCommMode:    '抽成方式',
    lblModePercent: '百分比 %',
    lblModeHourly:  '時薪制 A$/hr',
    lblBase:        '每日底薪',
    lblRate:        '抽成比例 %',
    lblHourlyRate:  '每小時抽成 (A$)',
    lblDaily:       '每日業績',
    lblDailyHourly: '每日工時',
    lblSummary:     '本週小結',
    lblTotalRev:    '總業績',
    lblTotalHours:  '總工時',
    lblTotalComm:   '總抽成',
    lblFinalPay:    '實領薪資',
    lblWageMode:    '計薪方式：',
    btnCopy:        '複製結果',
    btnClear:       '清除本週',
    btnPrint:       '列印',
    days:           ['週一','週二','週三','週四','週五','週六','週日'],
    phRevenue:      '業績金額',
    phHours:        '工時 (hrs)',
    noData:         '尚未輸入',
    moreComm:       '抽成制為主',
    moreBase:       '底薪制為主',
    hintPercent:    function(b,r){ return '每日底薪 '+b+'，超過則用業績 × '+r+'%'; },
    hintHourly:     function(b,r){ return '每日底薪 '+b+'，超過則用工時 × A$'+r+'/hr'; },
    copyHeader:     '📊 週薪計算紀錄',
    copyPeriod:     function(s,e){ return '週期：'+s+' – '+e; },
    copySettingsPct:function(b,r){ return '每日底薪：A$'+b+' ／ 抽成：'+r+'%'; },
    copySettingsHr: function(b,r){ return '每日底薪：A$'+b+' ／ 時薪抽成：A$'+r+'/hr'; },
    copyRowPct:     function(d,dt,rev,comm,pay){ return d+' '+dt+'：業績 '+rev+' → 抽成 '+comm+' → 實領 '+pay; },
    copyRowHr:      function(d,dt,hrs,comm,pay){ return d+' '+dt+'：工時 '+hrs+'hrs → 抽成 '+comm+' → 實領 '+pay; },
    copyTotal:      function(v){ return '總業績：'+v; },
    copyTotalHrs:   function(v){ return '總工時：'+v+' hrs'; },
    copyComm:       function(c){ return '總抽成：'+c; },
    copyFinal:      function(f){ return '✅ 實領薪資：'+f; },
    copied:         '✓ 已複製',
    confirmClear:   '確定要清除本週所有資料？'
  },
  en: {
    h1second:       'Calculator',
    titleSub:       'Commission · AUD · Weekly Record',
    lblCommMode:    'Commission Mode',
    lblModePercent: 'Percentage %',
    lblModeHourly:  'Hourly A$/hr',
    lblBase:        'Daily Base Pay',
    lblRate:        'Commission %',
    lblHourlyRate:  'Rate per Hour (A$)',
    lblDaily:       'Daily Revenue',
    lblDailyHourly: 'Daily Hours',
    lblSummary:     'Weekly Summary',
    lblTotalRev:    'Total Revenue',
    lblTotalHours:  'Total Hours',
    lblTotalComm:   'Total Commission',
    lblFinalPay:    'Final Pay',
    lblWageMode:    'Pay Mode:',
    btnCopy:        'Copy Result',
    btnClear:       'Clear Week',
    btnPrint:       'Print',
    days:           ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
    phRevenue:      'Revenue',
    phHours:        'Hours',
    noData:         'No data yet',
    moreComm:       'Mostly Commission',
    moreBase:       'Mostly Base Pay',
    hintPercent:    function(b,r){ return 'Base '+b+'/day; commission if revenue × '+r+'% > base'; },
    hintHourly:     function(b,r){ return 'Base '+b+'/day; commission if hours × A$'+r+' > base'; },
    copyHeader:     '📊 Weekly Pay Record',
    copyPeriod:     function(s,e){ return 'Period: '+s+' – '+e; },
    copySettingsPct:function(b,r){ return 'Daily Base: A$'+b+' / Commission: '+r+'%'; },
    copySettingsHr: function(b,r){ return 'Daily Base: A$'+b+' / Hourly Rate: A$'+r+'/hr'; },
    copyRowPct:     function(d,dt,rev,comm,pay){ return d+' '+dt+': Revenue '+rev+' → Comm '+comm+' → Pay '+pay; },
    copyRowHr:      function(d,dt,hrs,comm,pay){ return d+' '+dt+': '+hrs+'hrs → Comm '+comm+' → Pay '+pay; },
    copyTotal:      function(v){ return 'Total Revenue: '+v; },
    copyTotalHrs:   function(v){ return 'Total Hours: '+v; },
    copyComm:       function(c){ return 'Total Commission: '+c; },
    copyFinal:      function(f){ return '✅ Final Pay: '+f; },
    copied:         '✓ Copied',
    confirmClear:   'Clear all data for this week?'
  }
};

/* =====================
   STATE
   ===================== */
var lang       = localStorage.getItem('salary_lang') || 'zh';
var commMode   = localStorage.getItem('salary_mode') || 'percent';
var weekOffset = 0;

/* =====================
   LANGUAGE
   ===================== */
function setLang(l) {
  lang = l;
  localStorage.setItem('salary_lang', l);
  document.getElementById('btnZh').classList.toggle('is-active', l === 'zh');
  document.getElementById('btnEn').classList.toggle('is-active', l === 'en');
  applyStrings();
  buildDayRows();
  loadData();
}

function applyStrings() {
  var s = STRINGS[lang];
  document.getElementById('h1-second').textContent       = s.h1second;
  document.getElementById('title-sub').textContent       = s.titleSub;
  document.getElementById('lbl-commMode').textContent    = s.lblCommMode;
  document.getElementById('lbl-modePercent').textContent = s.lblModePercent;
  document.getElementById('lbl-modeHourly').textContent  = s.lblModeHourly;
  document.getElementById('lbl-base').textContent        = s.lblBase;
  document.getElementById('lbl-rate').textContent        = s.lblRate;
  document.getElementById('lbl-hourlyRate').textContent  = s.lblHourlyRate;
  document.getElementById('lbl-daily').textContent       = commMode === 'percent' ? s.lblDaily    : s.lblDailyHourly;
  document.getElementById('lbl-summary').textContent     = s.lblSummary;
  document.getElementById('lbl-totalRev').textContent    = commMode === 'percent' ? s.lblTotalRev : s.lblTotalHours;
  document.getElementById('lbl-totalComm').textContent   = s.lblTotalComm;
  document.getElementById('lbl-finalPay').textContent    = s.lblFinalPay;
  document.getElementById('lbl-wageMode').textContent    = s.lblWageMode;
  document.getElementById('btnCopy').textContent         = s.btnCopy;
  document.getElementById('btnClear').textContent        = s.btnClear;
  document.getElementById('btnPrint').textContent        = s.btnPrint;
}

/* =====================
   COMMISSION MODE
   ===================== */
function setCommMode(mode) {
  commMode = mode;
  localStorage.setItem('salary_mode', mode);
  document.getElementById('btnModePercent').classList.toggle('is-active', mode === 'percent');
  document.getElementById('btnModeHourly').classList.toggle('is-active', mode === 'hourly');
  document.getElementById('field-percent').style.display = mode === 'percent' ? '' : 'none';
  document.getElementById('field-hourly').style.display  = mode === 'hourly'  ? '' : 'none';
  var s = STRINGS[lang];
  document.getElementById('lbl-daily').textContent    = mode === 'percent' ? s.lblDaily    : s.lblDailyHourly;
  document.getElementById('lbl-totalRev').textContent = mode === 'percent' ? s.lblTotalRev : s.lblTotalHours;
  buildDayRows();
  loadData();
}

/* =====================
   WEEK
   ===================== */
function getWeekStart(offset) {
  var now  = new Date();
  var dow  = now.getDay();
  var diff = dow === 0 ? -6 : 1 - dow;
  var mon  = new Date(now);
  mon.setDate(now.getDate() + diff + (offset || 0) * 7);
  mon.setHours(0, 0, 0, 0);
  return mon;
}

function pad(n) { return String(n).padStart(2, '0'); }

function formatDate(d) {
  return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
}

function formatDateFull(d) {
  return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
}

function getWeekKey(offset) {
  return 'week_' + getWeekStart(offset).toISOString().slice(0, 10) + '_' + commMode;
}

function updateWeekLabel() {
  var start = getWeekStart(weekOffset);
  var end   = new Date(start);
  end.setDate(start.getDate() + 6);
  document.getElementById('weekLabel').textContent =
    formatDateFull(start) + ' – ' + formatDateFull(end);
}

function changeWeek(dir) {
  weekOffset += dir;
  updateWeekLabel();
  buildDayRows();
  loadData();
}

/* =====================
   BUILD DAY ROWS
   ===================== */
function buildDayRows() {
  var container = document.getElementById('daysContainer');
  container.innerHTML = '';
  var start    = getWeekStart(weekOffset);
  var s        = STRINGS[lang];
  var isHourly = commMode === 'hourly';

  for (var i = 0; i < 7; i++) {
    var date = new Date(start);
    date.setDate(start.getDate() + i);

    var row = document.createElement('div');
    row.className = 'day-row';
    row.id = 'row-' + i;

    var nameDiv = document.createElement('div');
    nameDiv.className = 'day-name';
    nameDiv.appendChild(document.createTextNode(s.days[i]));
    var dateSpan = document.createElement('span');
    dateSpan.className   = 'day-date';
    dateSpan.textContent = formatDate(date);
    nameDiv.appendChild(dateSpan);

    var inp = document.createElement('input');
    inp.type        = 'number';
    inp.id          = 'primary-' + i;
    inp.className   = 'day-input';
    inp.placeholder = isHourly ? s.phHours : s.phRevenue;
    inp.min         = '0';
    inp.step        = isHourly ? '0.25' : '0.01';
    inp.addEventListener('input', function() { recalc(); saveData(); });

    var midDiv = document.createElement('div');
    midDiv.className   = 'day-mid';
    midDiv.id          = 'mid-' + i;
    midDiv.textContent = '—';

    var payDiv = document.createElement('div');
    payDiv.className   = 'day-pay';
    payDiv.id          = 'pay-' + i;
    payDiv.textContent = '—';

    row.appendChild(nameDiv);
    row.appendChild(inp);
    row.appendChild(midDiv);
    row.appendChild(payDiv);
    container.appendChild(row);
  }
}

/* =====================
   HELPERS
   ===================== */
function fmt(n) {
  return 'A$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getVal(id) {
  var el  = document.getElementById(id);
  var val = parseFloat(el.value);
  return isNaN(val) ? (parseFloat(el.placeholder) || 0) : val;
}

/* =====================
   RECALC
   ===================== */
function recalc() {
  var dailyBase    = getVal('baseSalary');
  var isHourly     = commMode === 'hourly';
  var rate         = isHourly ? getVal('hourlyRate') : getVal('commissionRate');
  var s            = STRINGS[lang];
  var totalPrimary = 0, totalComm = 0, totalFinalPay = 0, daysWorked = 0;

  for (var i = 0; i < 7; i++) {
    var inp   = document.getElementById('primary-' + i);
    var midEl = document.getElementById('mid-' + i);
    var payEl = document.getElementById('pay-' + i);
    if (!inp) continue;

    var primary = parseFloat(inp.value) || 0;
    var comm    = isHourly ? primary * rate : primary * rate / 100;

    if (primary > 0) {
      daysWorked++;
      totalPrimary += primary;
      totalComm    += comm;
      midEl.textContent = fmt(comm);

      if (comm > dailyBase) {
        totalFinalPay    += comm;
        midEl.className   = 'day-mid is-active';
        payEl.textContent = fmt(comm);
        payEl.className   = 'day-pay is-commission';
      } else {
        totalFinalPay    += dailyBase;
        midEl.className   = 'day-mid';
        payEl.textContent = fmt(dailyBase);
        payEl.className   = 'day-pay is-base';
      }
    } else {
      midEl.textContent = '—'; midEl.className = 'day-mid';
      payEl.textContent = '—'; payEl.className = 'day-pay';
    }
  }

  document.getElementById('totalRevenue').textContent =
    isHourly ? (totalPrimary % 1 === 0 ? totalPrimary + ' hrs' : totalPrimary.toFixed(2) + ' hrs')
             : fmt(totalPrimary);
  document.getElementById('totalCommission').textContent = fmt(totalComm);
  document.getElementById('finalPay').textContent        = fmt(totalFinalPay);

  var badge  = document.getElementById('modeBadge');
  var hint   = document.getElementById('calcHint');
  var tipBox = document.getElementById('tipBox');

  if (totalPrimary === 0) {
    badge.className   = 'mode-badge is-base';
    badge.textContent = s.noData;
    hint.textContent  = '';
    tipBox.classList.remove('is-visible');
  } else {
    var commWins      = totalComm > dailyBase * daysWorked;
    badge.className   = commWins ? 'mode-badge is-commission' : 'mode-badge is-base';
    badge.textContent = commWins ? s.moreComm : s.moreBase;
    hint.textContent  = isHourly
      ? s.hintHourly(fmt(dailyBase), rate)
      : s.hintPercent(fmt(dailyBase), rate);
    tipBox.classList.remove('is-visible');
  }

  saveData();
}

/* =====================
   SAVE / LOAD
   ===================== */
function saveData() {
  var values = [];
  for (var i = 0; i < 7; i++) {
    var el = document.getElementById('primary-' + i);
    values.push(el ? el.value : '');
  }
  var data = {
    baseSalary:     document.getElementById('baseSalary').value,
    commissionRate: document.getElementById('commissionRate').value,
    hourlyRate:     document.getElementById('hourlyRate').value,
    values:         values
  };
  localStorage.setItem(getWeekKey(weekOffset), JSON.stringify(data));
  localStorage.setItem('salary_settings', JSON.stringify({
    baseSalary:     data.baseSalary,
    commissionRate: data.commissionRate,
    hourlyRate:     data.hourlyRate,
    commMode:       commMode
  }));
}

function loadData() {
  var s = JSON.parse(localStorage.getItem('salary_settings') || '{}');
  if (s.baseSalary)     document.getElementById('baseSalary').value     = s.baseSalary;
  if (s.commissionRate) document.getElementById('commissionRate').value = s.commissionRate;
  if (s.hourlyRate)     document.getElementById('hourlyRate').value     = s.hourlyRate;

  var w = JSON.parse(localStorage.getItem(getWeekKey(weekOffset)) || '{}');
  if (w.values) {
    for (var i = 0; i < w.values.length; i++) {
      var el = document.getElementById('primary-' + i);
      if (el) el.value = w.values[i];
    }
  }
  recalc();
}

/* =====================
   CLEAR / COPY
   ===================== */
function clearWeek() {
  if (!confirm(STRINGS[lang].confirmClear)) return;
  for (var i = 0; i < 7; i++) {
    var el = document.getElementById('primary-' + i);
    if (el) el.value = '';
  }
  localStorage.removeItem(getWeekKey(weekOffset));
  recalc();
}

function copyResult() {
  var s         = STRINGS[lang];
  var dailyBase = getVal('baseSalary');
  var isHourly  = commMode === 'hourly';
  var rate      = isHourly ? getVal('hourlyRate') : getVal('commissionRate');
  var start     = getWeekStart(weekOffset);
  var end       = new Date(start);
  end.setDate(start.getDate() + 6);

  var lines = [
    s.copyHeader,
    s.copyPeriod(formatDateFull(start), formatDateFull(end)),
    isHourly ? s.copySettingsHr(dailyBase.toFixed(2), rate) : s.copySettingsPct(dailyBase.toFixed(2), rate),
    ''
  ];

  var totalPrimary = 0;
  for (var i = 0; i < 7; i++) {
    var el      = document.getElementById('primary-' + i);
    var primary = el ? (parseFloat(el.value) || 0) : 0;
    if (primary > 0) {
      totalPrimary += primary;
      var comm   = isHourly ? primary * rate : primary * rate / 100;
      var dayPay = comm > dailyBase ? comm : dailyBase;
      var d      = new Date(start);
      d.setDate(start.getDate() + i);
      lines.push(isHourly
        ? s.copyRowHr(s.days[i], formatDate(d), primary, fmt(comm), fmt(dayPay))
        : s.copyRowPct(s.days[i], formatDate(d), fmt(primary), fmt(comm), fmt(dayPay)));
    }
  }

  lines.push('');
  lines.push(isHourly
    ? s.copyTotalHrs(totalPrimary)
    : s.copyTotal(document.getElementById('totalRevenue').textContent));
  lines.push(s.copyComm(document.getElementById('totalCommission').textContent));
  lines.push(s.copyFinal(document.getElementById('finalPay').textContent));

  var btn = document.getElementById('btnCopy');
  navigator.clipboard.writeText(lines.join('\n')).then(function() {
    btn.textContent = s.copied;
    setTimeout(function() { btn.textContent = STRINGS[lang].btnCopy; }, 2000);
  });
}

/* =====================
   INIT
   ===================== */
(function() {
  var saved = JSON.parse(localStorage.getItem('salary_settings') || '{}');
  if (saved.commMode) {
    commMode = saved.commMode;
    document.getElementById('btnModePercent').classList.toggle('is-active', commMode === 'percent');
    document.getElementById('btnModeHourly').classList.toggle('is-active', commMode === 'hourly');
    document.getElementById('field-percent').style.display = commMode === 'percent' ? '' : 'none';
    document.getElementById('field-hourly').style.display  = commMode === 'hourly'  ? '' : 'none';
  }

  document.getElementById('btnZh').classList.toggle('is-active', lang === 'zh');
  document.getElementById('btnEn').classList.toggle('is-active', lang === 'en');

  applyStrings();
  updateWeekLabel();
  buildDayRows();
  loadData();
})();

</script>
